<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngageIQ Settings</title>
    <!-- Link to Bootstrap CSS (Assuming it will be placed in assets) -->
    <link rel="stylesheet" href="../assets/bootstrap.min.css">
    <!-- Link to custom CSS -->
    <link rel="stylesheet" href="../css/options.css">
</head>
<body>
    <div class="container mt-4">
        <h1>EngageIQ Settings</h1>

        <form id="settingsForm">
            <div class="mb-3">
                <label for="apiKey" class="form-label">Gemini API Key</label>
                <input type="password" class="form-control" id="apiKey" placeholder="Enter your API key">
            </div>
            <button type="submit" class="btn btn-primary" id="saveButton">Save Key</button>
        </form>

        <div id="statusMessage" class="mt-3"></div>
    </div>

    <!-- Link to options JavaScript -->
    <script src="../js/options.js"></script>
</body>
</html>
