<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EngageIQ</title>
    <!-- Bootstrap CSS -->
    <link href="../assets/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Custom Popup CSS -->
    <link href="../css/popup.css" rel="stylesheet" />
  </head>
  <body>
    <div
      class="container pt-2 pb-2"
      role="main"
      aria-label="EngageIQ Suggestions"
    >
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">EngageIQ</h5>
        <button 
          id="closeButton" 
          class="btn-close" 
          aria-label="Close popup"
          title="Close (Esc)"
        ></button>
      </div>

      <!-- Loading State -->
      <div
        id="loadingState"
        class="text-center"
        style="display: none"
        aria-live="polite"
        aria-atomic="true"
      >
        <div class="spinner-border spinner-border-sm" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <span class="ms-2">Generating suggestions...</span>
      </div>

      <!-- Error State -->
      <div
        id="errorState"
        class="alert alert-danger"
        role="alert"
        style="display: none"
        aria-live="assertive"
        aria-atomic="true"
      >
        <h6 class="alert-heading">Something went wrong</h6>
        <p class="mb-1" id="errorMessage"></p>
        <div id="errorAction" class="mt-2" style="display: none">
          <small class="text-muted" id="errorActionText"></small>
        </div>
      </div>

      <!-- Suggestions Accordion -->
      <div
        class="accordion"
        id="suggestionsAccordion"
        aria-label="Comment suggestions"
      >
        <!-- Accordion items will be injected here by popup.js -->
      </div>

      <!-- Model Indicator -->
      <div
        id="modelIndicator"
        class="model-indicator mt-3"
        aria-label="Current Gemini model"
      >
        <!-- Model info will be injected here by popup.js -->
      </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Popup JS -->
    <script src="../js/popup.js" type="module"></script>
  </body>
</html>
