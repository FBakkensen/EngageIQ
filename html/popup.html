<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EngageIQ</title>
    <!-- Bootstrap CSS -->
    <link href="../assets/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Custom Popup CSS -->
    <link href="../css/popup.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container pt-2 pb-2">
      <h5 class="mb-3">EngageIQ</h5>

      <!-- Loading State -->
      <div id="loadingState" class="text-center" style="display: none">
        <div class="spinner-border spinner-border-sm" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <span class="ms-2">Generating suggestions...</span>
      </div>

      <!-- Error State -->
      <div
        id="errorState"
        class="alert alert-danger"
        role="alert"
        style="display: none"
      >
        <h6 class="alert-heading">Something went wrong</h6>
        <p class="mb-1" id="errorMessage"></p>
        <div id="errorAction" class="mt-2" style="display: none">
          <small class="text-muted" id="errorActionText"></small>
        </div>
      </div>

      <!-- Suggestions Accordion -->
      <div class="accordion" id="suggestionsAccordion">
        <!-- Accordion items will be injected here by popup.js -->
      </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Popup JS -->
    <script src="../js/popup.js"></script>
  </body>
</html>
